name: AutoMix components

on:
  push:
    branches:
      - feat/automix
    tags:
      - AutoMix
    paths:
      - .github/workflows/automix.yml
      - native/automix-worker/**
      - scripts/export-automix-model.py
      - scripts/package-automix-runtime.ts
      - electron/main/services/automix/assets.ts
      - electron/main/services/automix/runtime.ts
      - Cargo.toml
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      create_release:
        description: 创建 AutoMix 草稿 Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: automix-components
  cancel-in-progress: false

jobs:
  models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 安装固定版本的模型导出依赖
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.2 onnx==1.23.0 onnxruntime==1.28.0 einops==0.8.2 rotary-embedding-torch==0.9.1 julius==0.2.7 pyyaml==6.0.3 dora-search==0.1.12 omegaconf==2.3.0
          # 仅导出网络，不安装音频读取、训练和命令行依赖
          python -m pip install --no-deps beat-this==1.1.0 demucs==4.0.1 openunmix==1.3.0
      - name: 下载官方权重并导出原精度模型
        run: |
          mkdir -p weights models
          curl --fail --location --output weights/final0.ckpt https://cloud.cp.jku.at/public.php/dav/files/7ik4RrBKTS273gp/final0.ckpt
          curl --fail --location --output weights/955717e8-8726e21a.th https://dl.fbaipublicfiles.com/demucs/hybrid_transformer/955717e8-8726e21a.th
          python scripts/export-automix-model.py beat weights/final0.ckpt models
          python scripts/export-automix-model.py demucs weights/955717e8-8726e21a.th models
      - uses: actions/upload-artifact@v6
        with:
          name: automix-models
          compression-level: 0
          path: |
            models/automix-*.zip
            models/beat-this.json
            models/htdemucs.json
          if-no-files-found: error

  runtime:
    needs: models
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: 移除本地开发镜像配置
        shell: bash
        run: rm -f .npmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cargo test -p automix-worker --locked
      - run: cargo clippy -p automix-worker --locked -- -D warnings
      - uses: actions/download-artifact@v7
        with:
          name: automix-models
          path: models
      - name: 构建运行包并校验两个模型的实际推理
        run: pnpm exec tsx scripts/package-automix-runtime.ts node_modules/.cache/automix-runtime models
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: automix-${{ runner.os }}-${{ matrix.arch }}
          compression-level: 0
          path: |
            node_modules/.cache/automix-runtime/automix-runtime-*.zip
            node_modules/.cache/automix-runtime/*-x64.json
            node_modules/.cache/automix-runtime/*-arm64.json
          if-no-files-found: error

  release:
    needs: [models, runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: automix-*
          merge-multiple: true
          path: release-assets
      - name: 汇总模型与六个平台运行包
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -name 'automix-*.zip' | wc -l)" -eq 8
          sha256sum automix-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: automix-release
          compression-level: 0
          path: release-assets/*
          if-no-files-found: error
      - name: 创建草稿 Release 并上传全部组件
        if: inputs.create_release || github.ref == 'refs/tags/AutoMix'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_commit="$(git ls-remote --tags origin refs/tags/AutoMix 'refs/tags/AutoMix^{}' | tail -n 1 | cut -f 1)"
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "AutoMix 标签与本次构建的提交不一致"
            exit 1
          fi
          gh release create AutoMix release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Auto Mix" \
            --notes "AutoMix 独立组件：两份共用 FP32 模型及 Windows、macOS、Linux 的 x64 / ARM64 运行包，来源与校验信息见附件。" \
            --draft --latest=false
